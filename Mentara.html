<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mentara • Studio STIRVO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14b8a6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070b1a;overflow:hidden;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#fff;overscroll-behavior:none}
#app{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;display:block;background:#000}
.screen{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(8,12,32,.76);padding:8px;touch-action:pan-y;z-index:5}
.screen.on{display:flex}
.panel{background:linear-gradient(160deg,#1f2a5c,#2b1e5c);border:3px solid #7dd3fc;border-radius:20px;padding:18px 22px;width:min(490px,100%);max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 40px #000a;touch-action:pan-y}
h1{margin:0 0 4px;font-size:30px;color:#ffd23a;text-shadow:0 3px 0 #b45309}
h2{margin:0 0 8px;font-size:25px;color:#ffd23a}
.sub{margin:2px 0 10px;color:#bcd0ff;font-size:15px}
.logo{font-weight:900;letter-spacing:7px;font-size:30px;direction:ltr;background:linear-gradient(90deg,#22d3b0,#7dd3fc,#ffd23a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 2px}
.studio{direction:ltr;font-size:13px;color:#9fb2ff;letter-spacing:2px;margin:0 0 6px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:9px;border:0;border-radius:10px;background:#10163a;color:#9fb2ff;font-size:16px;cursor:pointer;font-family:inherit}
.tab.on{background:#14b8a6;color:#fff;font-weight:bold}
input,textarea,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:2px solid #475494;background:#10163a;color:#fff;font-size:16px;text-align:center;-webkit-user-select:text;user-select:text;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:#7dd3fc}
.b{display:block;width:100%;margin:7px 0;padding:12px;border:0;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;color:#fff;background:linear-gradient(#22d3b0,#0d9488);box-shadow:0 4px 0 #0a6b62;font-family:inherit}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #0a6b62}
.b.o{background:linear-gradient(#ffb23a,#e8790e);box-shadow:0 4px 0 #a5520a}
.b.g{background:linear-gradient(#6b7bbd,#46538f);box-shadow:0 4px 0 #2d3763;font-size:15px;padding:10px}
.b.danger{background:linear-gradient(#ef4444,#b91c1c);box-shadow:0 4px 0 #7f1d1d}
.b:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .b{margin:4px 0}
#err{min-height:22px;color:#ff8a8a;font-size:15px;margin:2px 0}
.hint{font-size:13px;color:#9fb2ff;margin:8px 0 0;line-height:1.7;white-space:pre-line}
.stats{display:flex;justify-content:space-around;background:#10163a;border-radius:12px;padding:8px;margin:8px 0;font-size:14px}
.stats b{display:block;font-size:20px;color:#ffd23a}
.lb{background:#10163a;border-radius:12px;padding:6px 10px;margin:8px 0;font-size:15px}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid #26306a;cursor:pointer;border-radius:8px;transition:background .2s}
.lb-row:hover{background:#1a2456}
.lb-row:last-child{border:0}
.langs{display:flex;gap:6px;margin:8px 0}
.langs button{flex:1;padding:8px 4px;border:2px solid #475494;background:#10163a;color:#cfd8ff;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
.langs button.on{background:#14b8a6;border-color:#7dd3fc;color:#fff;font-weight:bold}
.lgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.lgrid button{padding:11px 0;border:0;border-radius:10px;background:#46538f;color:#fff;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit}
.lgrid button.done{background:#0d9488}
.lgrid button.cur{background:#e8790e;box-shadow:0 0 0 3px #ffd23a}
.lgrid button:disabled{opacity:.3;cursor:not-allowed}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pager .b{width:60px;margin:0;padding:8px}
.item{display:flex;align-items:center;gap:10px;background:#10163a;border-radius:12px;padding:8px;margin:6px 0;text-align:start;border:1px solid #26306a}
.item.rare{border:2px solid #ffd23a;background:linear-gradient(90deg,#10163a,#2a1f4d)}
.item .sw{width:46px;height:46px;border-radius:10px;flex:none;border:2px solid #fff5;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#1a2250}
.item .sw svg,.item .sw img{width:100%;height:100%;object-fit:cover;display:block}
.item .nm{flex:1;font-size:15px}
.item .nm small{display:block;color:#9fb2ff;font-size:12px;margin-top:2px}
.item .b{width:auto;min-width:96px;margin:0;padding:9px 10px;font-size:15px}
.sec{color:#ffd23a;font-weight:bold;margin:12px 0 4px;text-align:start;font-size:16px;border-bottom:1px solid #475494;padding-bottom:3px}
#bal{font-size:22px;color:#ffd23a;font-weight:bold;margin:2px 0 6px}
#hudbtn{position:absolute;display:none;gap:6px;z-index:4}
#hudbtn.on{display:flex}
#hudbtn button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:20px;cursor:pointer}
#touch{position:absolute;left:0;right:0;top:0;bottom:0;display:none;direction:ltr;pointer-events:none;z-index:4}
#touch.on{display:block}
.tb{position:absolute;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.5);color:#fff;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-weight:bold}
.tb.on{background:rgba(255,255,255,.5)}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:12px;display:none;z-index:9;font-size:16px;text-align:center;max-width:90%;border:1px solid #7dd3fc}
.av-circle{width:76px;height:76px;border-radius:50%;margin:0 auto 8px;border:3px solid #ffd23a;overflow:hidden;background:#10163a;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px #0008}
.av-circle svg,.av-circle img{width:100%;height:100%;object-fit:cover}
.av-mini{width:28px;height:28px;border-radius:50%;overflow:hidden;display:inline-block;vertical-align:middle;border:1.5px solid #7dd3fc;margin-inline-end:6px;background:#10163a}
.av-mini svg,.av-mini img{width:100%;height:100%;object-fit:cover}
.bio-box{background:#10163a;border-radius:10px;padding:10px;margin:8px 0;color:#cfd8ff;font-size:14px;min-height:44px;border:1px solid #26306a}
.verified{display:inline-block;width:14px;height:14px;background:#38bdf8;color:#fff;border-radius:50%;font-size:9px;text-align:center;line-height:14px;margin-inline-start:4px;vertical-align:middle}
/* الدائرة السريّة لدخول لوحة التحكم */
#secret-admin-btn{position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);cursor:pointer;z-index:20;transition:background .2s}
#secret-admin-btn:hover{background:#ffd23a}
.admin-row{display:flex;justify-content:space-between;align-items:center;background:#0a0f26;padding:6px 8px;border-radius:8px;margin-top:6px;border:1px solid #26306a}
.admin-thumb{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1.5px solid #ffd23a}
@media (max-height:520px){.panel{padding:10px 14px}h2{font-size:20px;margin-bottom:4px}.b{padding:8px;margin:4px 0;font-size:16px}.stats{margin:4px 0}.hint{margin-top:4px}.logo{font-size:22px}}
</style>
</head>
<body>
<div id="app">
<div id="secret-admin-btn" title="Admin" onclick="openSecretAdmin()"></div>
<canvas id="c" width="800" height="560"></canvas>
<div id="hudbtn"><button id="bp">⏸</button><button id="bm">🔊</button><button id="bf">⛶</button></div>
<div id="touch">
<div class="tb" id="tl">◀</div>
<div class="tb" id="tr">▶</div>
<div class="tb" id="tru">⚡</div>
<div class="tb" id="tj">⤒</div>
</div>
<div id="toast"></div>

<!-- شاشة تسجيل الدخول -->
<div class="screen on" id="s-login"><div class="panel">
<div class="logo">STIRVO</div><div class="studio">STUDIO</div>
<h1 data-i="title"></h1><div class="sub" data-i="login_sub"></div>
<div class="langs"><button data-act="lang" data-v="ar">العربية</button><button data-act="lang" data-v="fr">Français</button><button data-act="lang" data-v="en">English</button></div>
<div class="tabs"><button class="tab on" data-act="tab" data-v="login" data-i="tab_login"></button><button class="tab" data-act="tab" data-v="reg" data-i="tab_reg"></button></div>
<form id="f" autocomplete="off">
<input id="u" data-ip="ph_user" maxlength="16" autocomplete="off">
<input id="p" type="password" data-ip="ph_pass" maxlength="40" autocomplete="off">
<div id="err"></div>
<button class="b" id="go" type="submit"></button>
</form>
<button class="b g" data-act="about" data-i="about"></button>
<div class="hint" data-i="hint_save"></div>
</div></div>

<!-- القائمة الرئيسية -->
<div class="screen" id="s-menu"><div class="panel">
<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px">
 <div id="menu-av" class="av-mini" style="width:38px;height:38px;cursor:pointer" data-act="profile"></div>
 <h2 id="mname" style="margin:0"></h2>
</div>
<div class="stats"><div><b id="mb">0</b><span data-i="st_best"></span></div><div><b id="mc">0</b><span data-i="st_coins"></span></div><div><b id="ml">1</b><span data-i="st_level"></span></div></div>
<button class="b" id="bcont" data-act="cont"></button>
<div class="grid2"><button class="b o" data-act="levels" data-i="levels"></button><button class="b o" data-act="shop" data-i="shop"></button></div>
<div class="grid2"><button class="b o" data-act="profile" data-i="btn_profile"></button><button class="b o" data-act="chat" data-i="btn_chat"></button></div>
<button class="b o" data-act="codes" data-i="btn_codes"></button>
<div class="grid2"><button class="b g" data-act="about" data-i="about"></button><button class="b g" data-act="reset" data-i="reset"></button></div>
<div class="langs"><button data-act="lang" data-v="ar">العربية</button><button data-act="lang" data-v="fr">Français</button><button data-act="lang" data-v="en">English</button></div>
<div class="lb" id="lb"></div>
<button class="b g" data-act="logout" data-i="logout"></button>
<div class="studio">Studio STIRVO</div>
</div></div>

<!-- شاشة تبديل الأكواد بوحدها -->
<div class="screen" id="s-codes"><div class="panel">
<h2 data-i="codes_title"></h2>
<div class="sub" data-i="codes_sub"></div>
<input id="code-in" maxlength="32" data-ip="ph_code" style="text-align:center;text-transform:uppercase">
<button class="b" data-act="redeem" data-i="redeem_btn"></button>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<!-- شاشة لوحة تحكم الأدمن السرية -->
<div class="screen" id="s-admin"><div class="panel">
<h2 style="color:#ffd23a">🛠️ لوحة تحكم الأدمن</h2>
<div class="sub">تحكم كامل باللعبة والأكواد والتخفيضات والحسابات</div>

<div style="background:#161e4a;border:2px solid #ffd23a;border-radius:12px;padding:12px;margin:10px 0;text-align:start">
 <div style="font-weight:bold;color:#ffd23a;margin-bottom:6px">🎟️ إضافة كود بصورة خاصة</div>
 <input id="adm-c-name" placeholder="اسم الكود (مثال: INSTA50)" style="text-transform:uppercase">
 <input type="file" id="adm-c-file" accept="image/*" style="font-size:12px">
 <button class="b" onclick="adminCreateCode()" style="padding:8px;font-size:14px;margin-top:4px">➕ حفظ الكود</button>
 <div id="adm-codes-box" style="margin-top:6px;max-height:100px;overflow:auto"></div>

 <div style="font-weight:bold;color:#ffd23a;margin:10px 0 6px">🏷️ تخفيضات الأسعار (الثمن الجديد بالاحمر)</div>
 <select id="adm-d-item" style="font-size:13px;padding:6px">
  <option value="duck_yellow">البطة الصفراء (400)</option>
  <option value="duck_sus">البطة الغامضة (750)</option>
  <option value="capybara">كابيبارا (600)</option>
  <option value="cat_knight">القط الفارس (1200)</option>
  <option value="sketch_girl">فتاة الرسم (1500)</option>
  <option value="mr_bean">مستر بين (2000)</option>
  <option value="pikachu_load">جاري التحميل (2200)</option>
  <option value="hacker_cat">قط الهاكر (2500)</option>
 </select>
 <input id="adm-d-price" type="number" placeholder="الثمن الجديد" style="font-size:13px;padding:6px">
 <button class="b o" onclick="adminSaveDiscount()" style="padding:8px;font-size:14px;margin-top:4px">💾 تطبيق التخفيض</button>
 <div id="adm-disc-box" style="margin-top:6px;font-size:12px"></div>

 <div style="font-weight:bold;color:#ffd23a;margin:10px 0 6px">👥 لائحة الحسابات والتوثيق (علامة زرقاء)</div>
 <div id="adm-users-box" style="max-height:150px;overflow:auto"></div>
</div>

<button class="b g" onclick="backFromAdmin()">رجوع للقائمة</button>
</div></div>

<div class="screen" id="s-levels"><div class="panel">
<h2 data-i="lv_title"></h2>
<div class="lgrid" id="lgrid"></div>
<div class="pager"><button class="b g" data-act="lpage" data-v="-1">◀</button><span id="lpg"></span><button class="b g" data-act="lpage" data-v="1">▶</button></div>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<div class="screen" id="s-shop"><div class="panel">
<h2 data-i="shop_title"></h2>
<div id="bal"></div>
<div id="shopbox"></div>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<div class="screen" id="s-about"><div class="panel">
<div class="logo">STIRVO</div><div class="studio">STUDIO</div>
<h2 data-i="title"></h2>
<div class="sub" data-i="about_desc"></div>
<div class="sub"><span data-i="about_dev"></span> <b style="color:#fff">Studio STIRVO</b></div>
<div class="sub"><span data-i="about_ver"></span> v1.0.0</div>
<div class="langs"><button data-act="lang" data-v="ar">العربية</button><button data-act="lang" data-v="fr">Français</button><button data-act="lang" data-v="en">English</button></div>
<div class="hint" data-i="controls"></div>
<div class="hint">© 2026 Studio STIRVO<br><span data-i="rights"></span></div>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<div class="screen" id="s-profile"><div class="panel">
<h2 data-i="prof_title"></h2>
<div class="av-circle" id="prof-av"></div>
<div class="sub" style="font-size:12px" data-i="prof_av_hint"></div>
<input id="prof-name" maxlength="16" data-ip="ph_dispname" style="text-align:center">
<textarea id="prof-bio" maxlength="120" data-ip="ph_bio" style="width:100%;min-height:60px;border-radius:10px;border:2px solid #475494;background:#10163a;color:#fff;padding:10px;font-family:inherit;margin:6px 0;text-align:start"></textarea>
<div class="sub" data-i="country_flag"></div>
<div id="flag-grid" style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:110px;overflow:auto;margin:6px 0"></div>
<button class="b" data-act="saveprof" data-i="save_btn"></button>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<div class="screen" id="s-viewprof"><div class="panel">
<h2 id="vp-title">👤</h2>
<div class="av-circle" id="vp-av"></div>
<div style="font-size:22px;font-weight:bold;color:#ffd23a;margin:4px 0" id="vp-name"></div>
<div id="vp-badge" style="font-size:13px;color:#22d3b0;margin-bottom:6px"></div>
<div class="bio-box" id="vp-bio"></div>
<div class="stats">
 <div><b id="vp-best">0</b><span data-i="st_best"></span></div>
 <div><b id="vp-lv">1</b><span data-i="st_level"></span></div>
</div>
<button class="b g" data-act="closevp" data-i="back"></button>
</div></div>

<div class="screen" id="s-chat"><div class="panel">
<h2 data-i="chat_title"></h2>
<div class="sub" data-i="chat_sub"></div>
<div id="chatbox" style="background:#10163a;border-radius:12px;height:190px;overflow:auto;padding:8px;text-align:start;font-size:14px;margin:8px 0"></div>
<input id="chat-in" maxlength="80" data-ip="ph_chat" style="text-align:start">
<button class="b" data-act="sendchat" data-i="send_btn"></button>
<button class="b g" data-act="back" data-i="back"></button>
</div></div>

<div class="screen" id="s-pause"><div class="panel"><h2 data-i="pause"></h2>
<button class="b" data-act="resume" data-i="resume"></button>
<button class="b o" data-act="restart" data-i="restart"></button>
<button class="b g" data-act="tomenu" data-i="menu"></button></div></div>

<div class="screen" id="s-over"><div class="panel"><h2 data-i="over_t"></h2>
<div class="sub" id="overtxt"></div>
<button class="b o" data-act="retry" data-i="retry"></button>
<button class="b g" data-act="tomenu" data-i="menu"></button></div></div>

<div class="screen" id="s-clear"><div class="panel"><h2 data-i="clear_t"></h2>
<div class="sub" id="cleartxt"></div>
<button class="b" data-act="next" data-i="next"></button>
<button class="b g" data-act="tomenu" data-i="menu"></button></div></div>

<div class="screen" id="s-win"><div class="panel"><h2 data-i="win_t"></h2>
<div class="sub" id="wintxt"></div>
<div class="studio">Studio STIRVO</div>
<button class="b o" data-act="tomenu" data-i="menu"></button></div></div>
</div>

function rng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function genLevel(i){
 const R=rng(90210+i*7919),d=i/(NLEV-1),bonus=(i%10===4);
 const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),ch=p=>R()<p;
 const W=135+Math.floor(i*.58)+(i%7)*3,H=14;
 const g=[];for(let y=0;y<H;y++)g.push(new Uint8Array(W));
 for(let x=0;x<W;x++){g[12][x]=1;g[13][x]=1}
 const coins=[],enemyXs=[],flyers=[];
 const putCoin=(x,y)=>{if(x>=0&&x<W&&y>=0&&y<12&&g[y][x]===0)coins.push({x:x*T+T/2,y:y*T+T/2,got:false,ph:R()*6})};
 const coinRow=(x,y,n)=>{for(let k=0;k<n;k++)putCoin(x+k,y)};
 coinRow(3,10,3);
 const kinds=[['gap',3.5+1.8*d],['pipe',3],['spikes',bonus?1:2.2+5.5*d],['enemy',bonus?2:3.8+6.8*d],['plat',2.6],['stairs',1.3],['fly',bonus?1:1.4+4.8*d]];
 const total=kinds.reduce((a,k)=>a+k[1],0);
 const lim=W-26;
 let x=9;
 while(x<lim){
  let r=R()*total,kind='gap';
  for(const k of kinds){if(r<k[1]){kind=k[0];break}r-=k[1]}
  let w=0;
  if(kind==='gap'){
   const len=ri(2,3+(d>.15?1:0)+(d>.45?1:0)+(d>.75?1:0));
   for(let k=0;k<len;k++){g[12][x+k]=0;g[13][x+k]=0}
   if(ch(.55))coinRow(x,ri(8,9),len);
   w=len;
  }else if(kind==='pipe'){
   const h=ri(1,d>.25?3:2);
   for(let j=0;j<h;j++){g[11-j][x]=4;g[11-j][x+1]=4}
   if(ch(.45+d*.3))enemyXs.push(x+2);
   coinRow(x,10-h,2);w=2;
  }else if(kind==='spikes'){
   const n=ri(1,2+(d>.2?1:0)+(d>.55?1:0));
   for(let k=0;k<n;k++)g[11][x+k]=6;
   coinRow(x,9,n);w=n;
  }else if(kind==='enemy'){
   const n=ri(2,2+Math.floor(d*4.5));
   for(let k=0;k<n;k++)enemyXs.push(x+k*2);
   w=n*2+1;
  }else if(kind==='plat'){
   const len=ri(3,5);
   for(let k=0;k<len;k++)g[9][x+k]=2;
   if(ch(.65)){const l2=ri(2,3),o=ri(0,len-l2);for(let k=0;k<l2;k++)g[6][x+o+k]=2;coinRow(x+o,5,l2);if(ch(.5))g[6][x+o]=3}
   else if(ch(.7))g[6][x+ri(0,len-1)]=3;
   if(ch(.5))enemyXs.push(x+1);
   coinRow(x,8,len);w=len;
  }else if(kind==='stairs'){
   const n=ri(2,4);
   for(let a=0;a<n;a++)for(let j=0;j<=a;j++)g[11-j][x+a]=1;
   w=n;
  }else{
   const n=ri(1,2+(d>.25?1:0)+(d>.65?1:0));
   for(let k=0;k<n;k++)flyers.push([x+k*3,ri(6,9)]);
   w=n*3;
  }
  const sp=ri(3,6-Math.floor(d*2.2)),sx=x+w;
  if(ch(bonus?.95:.45))coinRow(sx+1,ri(9,10),ri(3,5));
  if(bonus&&ch(.7))coinRow(sx,7,5);
  if(sp>=4&&ch(.35)){const qx=sx+1;if(g[12][qx]===1&&g[9][qx]===0&&g[11][qx]===0)g[8][qx]=3}
  x=sx+sp;
 }
 for(let a=0;a<5;a++)for(let j=0;j<=a;j++)g[11-j][W-16+a]=1;
 const fx=W-6;for(let y=2;y<=11;y++)g[y][fx]=7;
 coinRow(W-11,10,4);
 const enemies=[];
 const spd0=1.35+d*1.45;
 enemyXs.forEach(ex=>{if(ex>=10&&ex<W-18&&g[12][ex]===1&&g[11][ex]===0&&g[10][ex]===0)enemies.push({type:'s',x:ex*T+3,y:12*T-30,w:34,h:30,vx:0,vy:0,dir:-1,spd:spd0+R()*.45,dying:0,gone:false})});
 flyers.forEach(([fxx,fy])=>{if(fxx<W-18)enemies.push({type:'f',x0:fxx*T,y0:fy*T,x:fxx*T,y:fy*T,w:34,h:26,vx:0,vy:0,t:R()*100,dir:1,spdF:0.032+d*0.018,dying:0,gone:false})});
 return {w:W,h:H,g,coins,enemies,fx,bonus};
}

  const now=ac.currentTime;
  const tone=(f1,f2,d,type,v,delay)=>{type=type||'square';v=v||.07;delay=delay||0;
   const o=ac.createOscillator(),g=ac.createGain();o.type=type;
   o.frequency.setValueAtTime(f1,now+delay);o.frequency.exponentialRampToValueAtTime(f2,now+delay+d);
   g.gain.setValueAtTime(v,now+delay);g.gain.exponentialRampToValueAtTime(.001,now+delay+d);
   o.connect(g);g.connect(ac.destination);o.start(now+delay);o.stop(now+delay+d+.02)};
  switch(n){
   case'jump':tone(320,700,.17);break;
   case'coin':tone(988,988,.07);tone(1319,1319,.2,'square',.07,.07);break;
   case'stomp':tone(280,80,.16,'triangle',.18);break;
   case'hurt':tone(320,60,.45,'sawtooth',.12);break;
   case'bump':tone(170,100,.09,'triangle',.18);break;
   case'buy':tone(660,990,.12);tone(990,1320,.15,'square',.07,.1);break;
   case'win':[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'square',.07,i*.14));break;
   case'over':[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.25,'triangle',.12,i*.2));break;
  }
 }catch(e){}
}

function act(a,v){
 sfxUnlock();
 switch(a){
  case'lang':LANG=v;try{localStorage.setItem(LANGK,v)}catch(e){}applyLang();break;
  case'tab':setMode(v);break;
  case'about':show('about');break;
  case'back':if(G.user)showMenu();else show('login');break;
  case'closevp':show(G.prevScreen||'menu');break;
  case'viewuser':viewOtherProfile(v);break;
  case'codes':$('code-in').value='';show('codes');break;
  case'redeem':{
   const c=$('code-in').value.trim().toUpperCase();
   if(!c)break;
   let codes={};try{codes=JSON.parse(localStorage.getItem(CODESK)||'{}')}catch(e){}
   const promo=codes[c];
   if(!promo){toast(t('code_invalid'));break;}
   const db=load(),u=getUser(db);
   u.usedCodes=u.usedCodes||[];
   if(u.usedCodes.includes(c)){toast('لقد استخدمت هذا الكود مسبقاً!');break;}

   const aid='custom_'+c.toLowerCase();
   if(!AVATARS.some(x=>x.id===aid)){
    AVATARS.push({id:aid,price:0,rare:true,html:`<img src="${promo.img}" alt="Gift">`});
   }
   if(!u.avatars.includes(aid))u.avatars.push(aid);
   u.avatar=aid;
   u.usedCodes.push(c);
   db[G.user]=u;save(db);
   $('code-in').value='';
   toast('🎁 مبروك! حصلت على الأفاثار الحصري!');
   break;
  }
  case'cont':{const u=getUser();startLevel(u.unlocked-1,false);break}
  case'levels':G.lpage=Math.floor((getUser().unlocked-1)/25);renderLevels();show('levels');break;
  case'lpage':G.lpage+=(+v);renderLevels();break;
  case'level':startLevel(+v,false);break;
  case'shop':renderShop();show('shop');break;

function tile(tx,ty){const lv=G.lv;if(tx<0||tx>=lv.w||ty<0||ty>=lv.h)return 0;return lv.g[ty][tx]}
function solidAt(tx,ty){if(tx<0)return true;const v=tile(tx,ty);return v>=1&&v<=5}
function collide(e){
 e.x+=e.vx;e.hitWall=false;
 let x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  if(solidAt(tx,ty)){if(e.vx>0)e.x=tx*T-e.w;else if(e.vx<0)e.x=(tx+1)*T;else continue;e.hitWall=true}
 }
 e.vy=Math.min(14,e.vy+GRAV);e.y+=e.vy;e.onGround=false;e.bumped=null;
 x0=Math.floor(e.x/T);x1=Math.floor((e.x+e.w-.01)/T);y0=Math.floor(e.y/T);y1=Math.floor((e.y+e.h-.01)/T);
 const dir=e.vy;let hit=false,best=null;
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  if(solidAt(tx,ty)){
   if(dir>0){e.y=ty*T-e.h;e.onGround=true;hit=true}
   else if(dir<0){e.y=(ty+1)*T;hit=true;const dd=Math.abs(tx*T+T/2-(e.x+e.w/2));if(!best||dd<best.d)best={tx,ty,d:dd}}
  }
 }
 if(hit)e.vy=0;
 if(best)e.bumped=[best.tx,best.ty];
}
function overlap(a,b,s){s=s||0;return a.x+s<b.x+b.w&&a.x+a.w-s>b.x&&a.y+s<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,col,n){for(let i=0;i<n;i++)G.parts.push({x,y,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,life:30+Math.random()*20,col,s:3+Math.random()*4})}
function floatText(x,y,s){G.texts.push({x,y,t:s,life:50})}
function bump(tx,ty){

 if(v===3){G.lv.g[ty][tx]=5;G.score+=50;G.levelCoins++;sfx('coin');burst(tx*T+T/2,ty*T,'#ffd23a',10);floatText(tx*T+T/2,ty*T-10,'+50')}
 else sfx('bump');
}

function updatePlayer(p){
 const lv=G.lv;
 const L=inp('l'),R=inp('r'),J=inp('j'),run=keys.ShiftLeft||keys.ShiftRight||keys.KeyX||touch.run;
 const max=(run?6.6:4.8)+G.spdB,acc=0.55;
 if(L&&!R){p.vx-=acc;p.face=-1}else if(R&&!L){p.vx+=acc;p.face=1}
 else{p.vx*=p.onGround?0.78:0.95;if(Math.abs(p.vx)<0.1)p.vx=0}
 p.vx=Math.max(-max,Math.min(max,p.vx));
 if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
 if(J){if(!p.jh&&p.coyote>0){p.vy=-G.jumpV;p.onGround=false;p.coyote=0;sfx('jump')}p.jh=true}
 else{if(p.jh&&p.vy<-5)p.vy=-5;p.jh=false}
 if(p.inv>0)p.inv--;
 collide(p);
 if(p.hitWall)p.vx=0;
 if(p.x<0){p.x=0;p.vx=0}
 if(p.x>lv.w*T-p.w)p.x=lv.w*T-p.w;
 if(p.bumped)bump(p.bumped[0],p.bumped[1]);
 if(p.onGround){
  const tx=Math.floor((p.x+p.w/2)/T),ty=Math.floor((p.y+p.h+1)/T),ry=ty-1;
  if(solidAt(tx-1,ty)&&solidAt(tx,ty)&&solidAt(tx+1,ty)&&tile(tx-1,ry)!==6&&tile(tx,ry)!==6&&tile(tx+1,ry)!==6&&tile(tx-1,ry)<1&&tile(tx+1,ry)<1){p.sx=p.x;p.sy=p.y}
 }
 const x0=Math.floor((p.x+6)/T),x1=Math.floor((p.x+p.w-6)/T),y0=Math.floor((p.y+8)/T),y1=Math.floor((p.y+p.h-1)/T);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
  const v=tile(tx,ty);
  if(v===7){clearLevel();return}
  if(v===6&&p.y+p.h>ty*T+14){loseLife();return}
 }
 if(p.y>VH+60)loseLife();
}
function update(){
 const p=G.p,lv=G.lv;G.t++;if(G.banner>0)G.banner--;
 updatePlayer(p);if(G.state!=='play')return;
 for(const e of lv.enemies){
  if(e.gone)continue;
  if(e.dying){if(--e.dying<=0)e.gone=true;continue}
  if(Math.abs(e.x-p.x)>Math.max(820,VW))continue;
  if(e.type==='s'){
   e.vx=e.dir*(e.spd||1.45);collide(e);if(e.hitWall)e.dir*=-1;
   if(e.onGround){const fx=e.dir>0?e.x+e.w+2:e.x-2;if(!solidAt(Math.floor(fx/T),Math.floor((e.y+e.h+2)/T)))e.dir*=-1}
   if(e.y>VH+100)e.gone=true;
  }else{
   const sf=e.spdF||0.032;
   e.t++;e.x=e.x0+Math.sin(e.t*sf)*105;e.y=e.y0+Math.sin(e.t*0.07)*36;e.dir=Math.cos(e.t*sf)>=0?1:-1;
  }
  if(overlap(p,e,2)){
   if(p.vy>0&&p.y+p.h-e.y<22+p.vy){
    e.dying=24;p.vy=inp('j')?-13:-8;G.score+=200;sfx('stomp');burst(e.x+e.w/2,e.y+e.h/2,e.type==='s'?'#b46be0':'#ffab4a',12);floatText(e.x,e.y-6,'+200');
   }else if(p.inv<=0){loseLife();if(G.state!=='play')return}
  }
 }
 for(const c of lv.coins){
  if(c.got)continue;
  if(Math.abs(c.x-(p.x+p.w/2))<G.magR&&Math.abs(c.y-(p.y+p.h/2))<G.magR+4){c.got=true;G.score+=50;G.levelCoins++;sfx('coin');burst(c.x,c.y,'#ffd23a',6)}
 }
 for(const [k,v] of G.bumps){if(v<=1)G.bumps.delete(k);else G.bumps.set(k,v-1)}
 for(const q of G.parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.3;q.life--}
 G.parts=G.parts.filter(q=>q.life>0);
 for(const q of G.texts){q.y-=.8;q.life--}
 G.texts=G.texts.filter(q=>q.life>0);
 const target=p.x+p.w/2-VW*0.4;G.cam+=(target-G.cam)*0.12;
 G.cam=Math.max(0,Math.min(lv.w*T-VW,G.cam));
}

 else{ctx.fillRect(-10+ph*3,-12,9,8);ctx.fillRect(2-ph*3,-12,9,8);ctx.fillStyle='#6b3a1e';ctx.fillRect(-11+ph*4,-5,12,5);ctx.fillRect(1-ph*4,-5,12,5)}
 ctx.fillStyle=sk.shirt;ctx.beginPath();ctx.roundRect(-11,-24,22,14,4);ctx.fill();
 ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-2,-22,4,10);
 ctx.fillStyle=sk.shirt;const a=air?-8:ph*5;ctx.save();ctx.translate(2,-21);ctx.rotate(a*.08);ctx.fillRect(-3,0,7,11);ctx.fillStyle='#ffd0a0';ctx.fillRect(-3,10,7,4);ctx.restore();
 ctx.fillStyle='#ffd0a0';ctx.beginPath();ctx.arc(0,-31,10,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-31,3.5,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(5,-31,1.8,0,7);ctx.fill();
 ctx.strokeStyle='#a0502a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(3,-27,3,.2,2.6);ctx.stroke();
 ctx.fillStyle=sk.cap;ctx.beginPath();ctx.arc(0,-33,10.5,Math.PI,0);ctx.fill();ctx.fillRect(-10.5,-34,21,3);
 ctx.fillStyle=sk.brim;ctx.fillRect(2,-35,13,4);
 ctx.fillStyle='#ffd23a';ctx.font='bold 9px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',-1,-38);
 ctx.restore();
}
function drawEnemy(e){
 if(e.gone)return;
 ctx.save();
 if(e.type==='s'){
  ctx.translate(e.x+e.w/2,e.y+e.h);
  if(e.dying){ctx.scale(1.3,.25);ctx.globalAlpha=e.dying/24}
  else{const sq=Math.sin(G.t*.2+e.x)*.06;ctx.scale(1+sq,1-sq)}
  ctx.fillStyle='#9b4dd1';ctx.beginPath();ctx.moveTo(-18,0);ctx.bezierCurveTo(-20,-26,-8,-34,0,-34);ctx.bezierCurveTo(8,-34,20,-26,18,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a30b0';[-10,0,10].forEach(x=>{ctx.beginPath();ctx.moveTo(x-4,-30+Math.abs(x)*.3);ctx.lineTo(x,-40+Math.abs(x)*.3);ctx.lineTo(x+4,-30+Math.abs(x)*.3);ctx.fill()});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-16,6,0,7);ctx.arc(7,-16,6,0,7);ctx.fill();
  ctx.fillStyle='#111';const d=e.dir*1.5;ctx.beginPath();ctx.arc(-6+d,-15,2.6,0,7);ctx.arc(7+d,-15,2.6,0,7);ctx.fill();
  ctx.strokeStyle='#3a0f55';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(-12,-24);ctx.lineTo(-2,-20);ctx.moveTo(13,-24);ctx.lineTo(3,-20);ctx.stroke();
  ctx.fillStyle='#e8d0ff';ctx.fillRect(-6,-6,4,4);ctx.fillRect(2,-6,4,4);
 }else{
  ctx.translate(e.x+e.w/2,e.y+e.h/2);
  if(e.dying){ctx.scale(1,.3);ctx.globalAlpha=e.dying/24}
  const fl=Math.sin(G.t*.5)*.7;
  ctx.fillStyle='#ffb04a';
  ctx.save();ctx.rotate(-.5+fl);ctx.beginPath();ctx.ellipse(-20,-6,16,7,0,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.rotate(.5-fl);ctx.beginPath();ctx.ellipse(20,-6,16,7,0,0,7);ctx.fill();ctx.restore();
  ctx.fillStyle='#e8590c';ctx.beginPath();ctx.arc(0,0,14,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-5,-3,4.5,0,7);ctx.arc(5,-3,4.5,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-5+e.dir*1.2,-3,2,0,7);ctx.arc(5+e.dir*1.2,-3,2,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-5,5);ctx.lineTo(-2,10);ctx.lineTo(1,5);ctx.lineTo(4,10);ctx.lineTo(7,5);ctx.fill();
 }
 ctx.restore();
}
function drawCoin(c){
 const w=Math.abs(Math.cos(G.t*.08+c.ph))*9+2;
 ctx.fillStyle='#ffd23a';ctx.beginPath();ctx.ellipse(c.x,c.y+Math.sin(G.t*.06+c.ph)*2,w,11,0,0,7);ctx.fill();
 ctx.strokeStyle='#b87a10';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#fff6a0';ctx.beginPath();ctx.ellipse(c.x-w*.25,c.y-3,Math.max(1,w*.25),4,0,0,7);ctx.fill();
}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 ctx.setTransform(K,0,0,K,0,0);
 const lv=G.lv;
 if(!lv){G.menuScroll+=1.2;drawBg(G.menuScroll,THEMES[0],G.menuScroll);return}
 const th=G.th;drawBg(G.cam,th,G.t);
 const cam=Math.round(G.cam);
 ctx.save();ctx.translate(-cam,0);
 const c0=Math.floor(cam/T),c1=c0+Math.ceil(VW/T)+1;
 for(let ty=0;ty<lv.h;ty++)for(let tx=c0;tx<=c1&&tx<lv.w;tx++){const v=lv.g[ty][tx];if(v)drawTile(v,tx,ty,th)}
 for(const c of lv.coins)if(!c.got&&c.x>cam-30&&c.x<cam+VW+30)drawCoin(c);
 for(const e of lv.enemies)if(e.x>cam-80&&e.x<cam+VW+80)drawEnemy(e);
 drawPlayer(G.p);
 for(const q of G.parts){ctx.globalAlpha=Math.min(1,q.life/25);ctx.fillStyle=q.col;ctx.fillRect(q.x,q.y,q.s,q.s)}
 ctx.globalAlpha=1;
 ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
 for(const q of G.texts){ctx.globalAlpha=Math.min(1,q.life/25);ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(q.t,q.x,q.y);ctx.fillText(q.t,q.x,q.y)}
 ctx.globalAlpha=1;ctx.restore();
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,VW,38);
 ctx.font='bold 19px Arial';ctx.textBaseline='middle';ctx.fillStyle='#fff';
 try{ctx.direction='ltr'}catch(e){}
 ctx.textAlign='left';
 ctx.fillText('❤️ ×'+G.lives,14,20);ctx.fillText('🪙 '+G.levelCoins,100,20);
 ctx.textAlign='right';ctx.fillText('⭐ '+G.score,VW-14,20);
 ctx.textAlign='center';
 try{ctx.direction=LANG==='ar'?'rtl':'ltr'}catch(e){}
 ctx.fillText(t('level')+' '+(G.lvIdx+1)+' / '+NLEV,VW/2,19);
 try{ctx.direction='ltr'}catch(e){}
 const pr=Math.max(0,Math.min(1,G.p.x/(lv.fx*T)));
 ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(VW/2-120,32,240,4);ctx.fillStyle='#22d3b0';ctx.fillRect(VW/2-120,32,240*pr,4);
 if(G.banner>0){
  ctx.globalAlpha=Math.min(1,G.banner/40);ctx.font='bold 52px Arial';ctx.textAlign='center';
  try{ctx.direction=LANG==='ar'?'rtl':'ltr'}catch(e){}
  ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.fillStyle='#ffd23a';
  const txt=t('level')+' '+(G.lvIdx+1);ctx.strokeText(txt,VW/2,200);ctx.fillText(txt,VW/2,200);ctx.globalAlpha=1;
  try{ctx.direction='ltr'}catch(e){}
 }
}

let last=0,accT=0;
function frame(ts){
 requestAnimationFrame(frame);
 if(!last)last=ts;accT+=Math.min(100,ts-last);last=ts;
 while(accT>=16.667){accT-=16.667;if(G.state==='play')update()}
 render();
}
fit();applyLang();setMode('login');
requestAnimationFrame(frame);
})();
</script>
